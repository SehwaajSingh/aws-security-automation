name: Security CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  security-scan-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 🔍 Secret Scan (fail fast)
    - name: Scan for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: .

    # 🔍 Vulnerability & misconfig scan
    - name: Run Trivy Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        severity: CRITICAL,HIGH
        exit-code: 1

    # 🔐 AWS AUTH (only after scans pass)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 🚀 DEPLOY
    - name: Deploy Lambda Function
      run: |
        zip function.zip lambda/lambda_function.py
        aws lambda update-function-code \
          --function-name AutoRemediateOpenSSH \
          --zip-file fileb://function.zip
